experiment_id: cut_in__laser__plant2__s001
spec:
  schema_version: 1.0.0
  experiment_id: cut_in__laser__plant2__s001
  scenario_family: cut_in
  algorithm: laser
  policy: plant2
  seed: 1
  scenario_config: /scratch/visraj12/scenario_orchestration/configs/scenario/cut_in.yaml
  algorithm_config: /scratch/visraj12/scenario_orchestration/configs/algorithm/laser.yaml
  policy_config: /scratch/visraj12/scenario_orchestration/configs/policy/plant2.yaml
  output_dir: /scratch/visraj12/scenario_orchestration/results/raw/cut_in__laser__plant2__s001
  tags:
    experiment: laser_full
scenario:
  name: cut_in
  semantic_id: cut_in
  description: An actor travelling in an adjacent lane cuts into the ego lane at close
    longitudinal range, forcing the ego vehicle to react.
  preconditions:
  - ego_travels_in_multilane_road
  - adjacent_lane_actor_present
  target_interaction: an adjacent actor cuts into the ego lane inside the ego safety
    envelope
  evaluation:
    horizon_s: 15
    target_event: cut_in_interaction
    tick_rate_hz: 10
    success_criteria:
    - scenario_realized
    - no_collision
  metrics:
  - scenario_realized
  - time_to_event
  - collision
  - near_collision
algorithm:
  name: laser
  adapter:
    _target_: scenario_orchestration.adapters.laser.LaserAdapter
  repository: third_party/laser
  entry_point: scenario_orchestration/run.py
  execution:
    interpreter: python
    timeout_s: 1800
  capabilities:
    scenario_families:
    - red_light
    - cut_in
    - lane_change
    - overtake
    - right_turn
    - left_turn
    policy_interfaces:
    - ego_policy_v1
    observation_spaces:
    - sensor
    - state
    action_spaces:
    - control
    - waypoints
    closed_loop: true
  unsupported:
    scenario_families: {}
    observation_spaces: {}
  requires:
    submodule: true
    entry_point: true
    python_modules: []
policy:
  name: plant2
  implementation: plant2.agent.PlanTAgent
  interface: ego_policy_v1
  observation_space: state
  action_space: waypoints
  repository: third_party/plant2
  entry_point: scenario_orchestration/policy.py
  description: Privileged-input transformer planner predicting ego waypoints.
  checkpoint: third_party/plant2/checkpoints
  parameters:
    num_waypoints: 4
  requires:
  - submodule
  - checkpoint
  - torch
  adapter:
    _target_: scenario_orchestration.adapters.policy.LearnedPolicyAdapter
tags:
  experiment: laser_full
