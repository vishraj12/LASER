experiment_id: right_turn__laser__idm__s000
spec:
  schema_version: 1.0.0
  experiment_id: right_turn__laser__idm__s000
  scenario_family: right_turn
  algorithm: laser
  policy: idm
  seed: 0
  scenario_config: /scratch/visraj12/scenario_orchestration/configs/scenario/right_turn.yaml
  algorithm_config: /scratch/visraj12/scenario_orchestration/configs/algorithm/laser.yaml
  policy_config: /scratch/visraj12/scenario_orchestration/configs/policy/idm.yaml
  output_dir: /scratch/visraj12/scenario_orchestration/results/raw/right_turn__laser__idm__s000
  tags:
    experiment: laser_full
scenario:
  name: right_turn
  semantic_id: right_turn
  description: The ego vehicle performs a right turn at an intersection while a crossing
    actor occupies the conflict zone.
  preconditions:
  - ego_approaches_intersection
  - ego_route_turns_right
  - crossing_actor_present
  target_interaction: the ego right turn conflicts with a crossing actor
  evaluation:
    horizon_s: 20
    target_event: right_turn_interaction
    tick_rate_hz: 10
    success_criteria:
    - scenario_realized
    - no_collision
  metrics:
  - scenario_realized
  - time_to_event
  - collision
  - near_collision
algorithm:
  name: laser
  adapter:
    _target_: scenario_orchestration.adapters.laser.LaserAdapter
  repository: third_party/laser
  entry_point: scenario_orchestration/run.py
  execution:
    interpreter: python
    timeout_s: 1800
  capabilities:
    scenario_families:
    - red_light
    - cut_in
    - lane_change
    - overtake
    - right_turn
    - left_turn
    policy_interfaces:
    - ego_policy_v1
    observation_spaces:
    - sensor
    - state
    action_spaces:
    - control
    - waypoints
    closed_loop: true
  unsupported:
    scenario_families: {}
    observation_spaces: {}
  requires:
    submodule: true
    entry_point: true
    python_modules: []
policy:
  name: idm
  implementation: idm.policy.IDMPolicy
  interface: ego_policy_v1
  observation_space: state
  action_space: control
  repository: third_party/idm
  entry_point: scenario_orchestration/policy.py
  description: Intelligent Driver Model car-following with nominal parameters.
  parameters:
    desired_speed_mps: 8.0
    time_headway_s: 1.5
    min_gap_m: 2.0
    max_accel_mps2: 1.5
    comfort_decel_mps2: 2.0
  adapter:
    _target_: scenario_orchestration.adapters.policy.PolicyAdapter
  requires: []
tags:
  experiment: laser_full
