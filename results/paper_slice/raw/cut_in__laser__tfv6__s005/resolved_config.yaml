experiment_id: cut_in__laser__tfv6__s005
spec:
  schema_version: 1.0.0
  experiment_id: cut_in__laser__tfv6__s005
  scenario_family: cut_in
  algorithm: laser
  policy: tfv6
  seed: 5
  scenario_config: /scratch/visraj12/scenario_orchestration/configs/scenario/cut_in.yaml
  algorithm_config: /scratch/visraj12/scenario_orchestration/configs/algorithm/laser.yaml
  policy_config: /scratch/visraj12/scenario_orchestration/configs/policy/tfv6.yaml
  output_dir: /scratch/visraj12/scenario_orchestration/results/raw/cut_in__laser__tfv6__s005
  tags:
    experiment: laser_full
scenario:
  name: cut_in
  semantic_id: cut_in
  description: An actor travelling in an adjacent lane cuts into the ego lane at close
    longitudinal range, forcing the ego vehicle to react.
  preconditions:
  - ego_travels_in_multilane_road
  - adjacent_lane_actor_present
  target_interaction: an adjacent actor cuts into the ego lane inside the ego safety
    envelope
  evaluation:
    horizon_s: 15
    target_event: cut_in_interaction
    tick_rate_hz: 10
    success_criteria:
    - scenario_realized
    - no_collision
  metrics:
  - scenario_realized
  - time_to_event
  - collision
  - near_collision
algorithm:
  name: laser
  adapter:
    _target_: scenario_orchestration.adapters.laser.LaserAdapter
  repository: third_party/laser
  entry_point: scenario_orchestration/run.py
  execution:
    interpreter: python
    timeout_s: 1800
  capabilities:
    scenario_families:
    - red_light
    - cut_in
    - lane_change
    - overtake
    - right_turn
    - left_turn
    policy_interfaces:
    - ego_policy_v1
    observation_spaces:
    - sensor
    - state
    action_spaces:
    - control
    - waypoints
    closed_loop: true
  unsupported:
    scenario_families: {}
    observation_spaces: {}
  requires:
    submodule: true
    entry_point: true
    python_modules: []
policy:
  name: tfv6
  implementation: scenario_orchestration.policy.build_policy
  interface: ego_policy_v1
  observation_space: sensor
  action_space: control
  repository: third_party/tfv6
  entry_point: scenario_orchestration/policy.py
  description: 'TransFuser v6 (LEAD, cvpr2026 branch): a camera + LiDAR + radar fusion
    planner, conditioned on a discrete navigation command. The command is never set
    directly even under the CARLA Leaderboard -- `GlobalRoutePlanner` derives it from
    route geometry -- so the adapter derives it the same way, from the heading change
    along `observation["route"]`.'
  checkpoint: third_party/checkpoints/tfv6_cvpr2026/tfv6_resnet34
  parameters:
    device: cuda:0
    town: Town10HD
  adapter:
    _target_: scenario_orchestration.adapters.policy.LearnedPolicyAdapter
  requires:
  - submodule
  - checkpoint
  - torch
  - gpu
tags:
  experiment: laser_full
