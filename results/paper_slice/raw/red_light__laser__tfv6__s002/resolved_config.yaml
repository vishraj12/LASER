experiment_id: red_light__laser__tfv6__s002
spec:
  schema_version: 1.0.0
  experiment_id: red_light__laser__tfv6__s002
  scenario_family: red_light
  algorithm: laser
  policy: tfv6
  seed: 2
  scenario_config: /scratch/visraj12/scenario_orchestration/configs/scenario/red_light.yaml
  algorithm_config: /scratch/visraj12/scenario_orchestration/configs/algorithm/laser.yaml
  policy_config: /scratch/visraj12/scenario_orchestration/configs/policy/tfv6.yaml
  output_dir: /scratch/visraj12/scenario_orchestration/results/raw/red_light__laser__tfv6__s002
  tags:
    experiment: laser_full
scenario:
  name: red_light
  semantic_id: red_light
  description: The ego vehicle crosses a signalised intersection with a green light
    while another actor enters the intersection against a red light.
  preconditions:
  - ego_approaches_signalised_intersection
  - ego_has_right_of_way
  - conflicting_actor_present
  target_interaction: another actor violates the signal and conflicts with the ego
    path
  evaluation:
    horizon_s: 20
    target_event: red_light_interaction
    tick_rate_hz: 10
    success_criteria:
    - scenario_realized
    - no_collision
  metrics:
  - scenario_realized
  - time_to_event
  - collision
  - near_collision
algorithm:
  name: laser
  adapter:
    _target_: scenario_orchestration.adapters.laser.LaserAdapter
  repository: third_party/laser
  entry_point: scenario_orchestration/run.py
  execution:
    interpreter: python
    timeout_s: 1800
  capabilities:
    scenario_families:
    - red_light
    - cut_in
    - lane_change
    - overtake
    - right_turn
    - left_turn
    policy_interfaces:
    - ego_policy_v1
    observation_spaces:
    - sensor
    - state
    action_spaces:
    - control
    - waypoints
    closed_loop: true
  unsupported:
    scenario_families: {}
    observation_spaces: {}
  requires:
    submodule: true
    entry_point: true
    python_modules: []
policy:
  name: tfv6
  implementation: scenario_orchestration.policy.build_policy
  interface: ego_policy_v1
  observation_space: sensor
  action_space: control
  repository: third_party/tfv6
  entry_point: scenario_orchestration/policy.py
  description: 'TransFuser v6 (LEAD, cvpr2026 branch): a camera + LiDAR + radar fusion
    planner, conditioned on a discrete navigation command. The command is never set
    directly even under the CARLA Leaderboard -- `GlobalRoutePlanner` derives it from
    route geometry -- so the adapter derives it the same way, from the heading change
    along `observation["route"]`.'
  checkpoint: third_party/checkpoints/tfv6_cvpr2026/tfv6_resnet34
  parameters:
    device: cuda:0
    town: Town10HD
  adapter:
    _target_: scenario_orchestration.adapters.policy.LearnedPolicyAdapter
  requires:
  - submodule
  - checkpoint
  - torch
  - gpu
tags:
  experiment: laser_full
